name: Bootstrap tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CHEZMOI_VERSION: 2.70.0

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: curl -fsLS https://get.chezmoi.io | sh -s -- -t "v$CHEZMOI_VERSION" -b "$HOME/.local/bin"

      - name: Shell syntax
        run: |
          sh -n install.sh
          bash -n tests/install.sh

      - name: Installer and template tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tests/install.sh
